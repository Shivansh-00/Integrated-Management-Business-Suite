apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ibms-core
  labels:
    app: ibms-core
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/websocket-services: ibms-core
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/rate-limit: "30"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains";
spec:
  ingressClassName: nginx
  rules:
  - host: ibms.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ibms-core
            port:
              number: 80
  tls:
  - hosts:
    - ibms.example.com
    secretName: ibms-core-tls
