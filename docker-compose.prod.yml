# =============================================================================
# IBMS Enterprise — Production Docker Compose (GCP VM / Docker Host)
# =============================================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

version: '3.9'

services:
  web:
    image: ${GCP_REGISTRY:-asia-south1-docker.pkg.dev/total-handler-463313-e2/ibms-docker}/ibms-web:${IMAGE_TAG:-latest}
    build: {}                              # Disable build in prod — use pre-built image
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SUPABASE_URL=${SUPABASE_URL:?SUPABASE_URL is required}
      - SUPABASE_KEY=${SUPABASE_KEY:?SUPABASE_KEY is required}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - HOST=0.0.0.0
      - PORT=8000
      - RELOAD=false
      - LOG_LEVEL=warning
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/gcp/ssl:/etc/nginx/ssl:ro
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    ports: []                              # No external port exposure in prod
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-}
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
