version: '3.9'
services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - redis
      - mariadb
  worker:
    build: .
    command: bash -lc "sleep infinity"
    env_file: .env
    depends_on:
      - redis
      - mariadb
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  mariadb:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: imbs
    ports:
      - "3306:3306"
