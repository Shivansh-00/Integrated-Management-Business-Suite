apiVersion: apps/v1
kind: Deployment
metadata:
  name: ibms-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ibms-web
  template:
    metadata:
      labels:
        app: ibms-web
    spec:
      containers:
        - name: web
          image: ibms:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ibms-web
spec:
  selector:
    app: ibms-web
  ports:
    - port: 80
      targetPort: 8000
