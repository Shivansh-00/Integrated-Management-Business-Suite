name: Frappe Enterprise CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pre-commit checks
        run: pre-commit run --all-files

      - name: Lint app code
        run: ruff check apps/imbs_core/imbs_core

      - name: Type check selected modules
        run: mypy apps/imbs_core/imbs_core/security apps/imbs_core/imbs_core/api

      - name: Unit tests
        run: pytest -q apps/imbs_core/tests

  build-image:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build baseline image
        run: docker build -t imbs-core-fastapi:ci .
