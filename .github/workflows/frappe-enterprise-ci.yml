name: Frappe Enterprise CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint app code
        run: ruff check apps/ibms_core/ibms_core apps/ibms_core/tests

      - name: Type check selected modules
        run: mypy apps/ibms_core/ibms_core/security apps/ibms_core/ibms_core/api

      - name: Unit tests
        run: pytest -q --tb=short
        env:
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_KEY: test-key
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-ci

  build-image:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build baseline image
        run: docker build -t ibms-core-fastapi:ci .
