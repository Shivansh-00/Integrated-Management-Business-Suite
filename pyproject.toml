[tool.pytest.ini_options]
pythonpath = [
  "apps/ibms_core"
]
testpaths = [
  "apps/ibms_core/tests"
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "node_modules", "deploy", "scripts", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = [".venv"]
